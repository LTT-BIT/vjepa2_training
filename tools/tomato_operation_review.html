<!doctype html><html lang="zh"><meta charset="utf-8"><title>操作结果独立复核</title>
<style>body{font:17px system-ui;max-width:1200px;margin:24px auto;background:#f6f7f9;color:#17202b}section{background:white;padding:18px;margin:14px 0;border-radius:10px}video{width:32%;background:#111}button,input,select,textarea{font:inherit;margin:5px;padding:7px}textarea{width:95%;height:70px}.warn{color:#a24900}#counter{font-weight:bold}label{display:inline-block;margin:5px}</style>
<h1>操作结果独立复核</h1><p>这里判断<strong>物体是否真的发生变化</strong>，不是标阶段。所有项目初始未审核。关节闭合、手臂抬升和阶段名称都不能单独证明成功。</p>
<section><label>审核者姓名/编号 <input id="reviewer"></label><button id="prev">上一项</button><button id="next">下一项</button><select id="item"></select><span id="counter"></span><p id="desc"></p><p id="id"></p></section>
<section><p>三路相机仅标cam0/1/2，物理角色尚未确认。请同时查看物体是否移动、分离或稳定接触，遮挡时选Unknown。</p><div id="videos"></div><button id="back">后退1帧</button><button id="forward">前进1帧</button><button id="play">同步播放/暂停</button><button id="markStart">当前帧记为开始</button><button id="markEnd">当前帧记为结束/证据完成</button><p id="time"></p></section>
<section><p>正样本＝符合独立可见条件；负样本＝同一条件可观察且明确未发生；看不见/无法判定＝Unknown。未看到成功不能自动当负样本。</p>
<label>结论 <select id="verdict"><option value="">未审核</option><option value="positive">Positive：有直接可见证据</option><option value="negative">Negative：可观察且明确未发生</option><option value="unknown">Unknown：证据不足</option></select></label>
<label>区间开始帧 <input id="start" type="number"></label><label>区间结束帧（不包含）<input id="end" type="number"></label><label>证据完成帧 <input id="evidence" type="number"></label>
<p><label><input type="checkbox" class="camera" value="cam0">cam0可见</label><label><input type="checkbox" class="camera" value="cam1">cam1可见</label><label><input type="checkbox" class="camera" value="cam2">cam2可见</label></p>
<textarea id="note" placeholder="描述直接证据、遮挡与歧义。不要只写“进入harvest”或“手闭合”。"></textarea><button id="save">保存此项（仅本浏览器）</button><button id="export">导出个人审核JSON</button><p class="warn">两名审核者分别导出；一致的独立意见才可合并。此页面不会修改原始标签，也不会自动训练。</p><p id="message"></p></section>
<script>
let cases,catalog,identity,index=0,store,key;const $=id=>document.getElementById(id);const rules={right_grasp_started:'右手开始抓握：可见新的接触/闭合尝试；不表示抓握成功',truss_stably_lifted:'稳定拿起：物体随右手离开支撑并持续共同运动；手臂空抬为负，遮挡为Unknown',left_pick_started:'左手开始摘取：可见新的目标接近/接触尝试；不等于脱离',tomato_detached:'番茄脱离：可见目标从果梗分离且后续状态一致；不得按harvest次数计数',truss_returned:'放回：物体有稳定支撑/释放证据；机械臂返程不算完成',adjustment_ended:'调整结束：有可见结束锚点；静止不一定表示结束，不清楚则Unknown',right_regrasp_started:'再次抓握：可见新的接触/闭合序列；重复阶段信息不能代替证据',second_grasp_verified:'第二次抓握确认：新的物体-手共同运动/稳定持有证据；不能直接复制pickup_2'};
function vids(){return [...document.querySelectorAll('video')]}
function draw(){const c=cases[index],e=catalog.find(e=>e.episode_id===c.episode_id);$('item').value=index;$('counter').textContent=`${index+1}/${cases.length} · 已填 ${Object.keys(store).length}`;$('desc').textContent=rules[c.event_type];$('id').textContent=`${c.split} / ${c.episode_id} / ${c.event_type}`;$('videos').replaceChildren();e.videos.forEach((_,i)=>{const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=`/media/${c.episode_id}/${i}`;v.onloadedmetadata=()=>v.currentTime=c.suggested_frame/e.fps;v.ontimeupdate=()=>{$('time').textContent=`首路时间 ${vids()[0].currentTime.toFixed(3)} 秒 / 帧 ${Math.floor(vids()[0].currentTime*e.fps+1e-4)}`};$('videos').append(v)});const r=store[c.case_id];$('verdict').value=r?.verdict||'';$('start').value=r?.start_frame??Math.max(0,c.suggested_frame-30);$('end').value=r?.end_frame??Math.min(e.length,c.suggested_frame+31);$('evidence').value=r?.evidence_end_frame??c.suggested_frame;$('note').value=r?.evidence_note||'';document.querySelectorAll('.camera').forEach(x=>x.checked=(r?.visible_cameras||[]).includes(x.value));}
function step(n){const e=catalog.find(e=>e.episode_id===cases[index].episode_id),t=Math.max(0,vids()[0].currentTime+n/e.fps);vids().forEach(v=>{v.pause();v.currentTime=t})}
$('back').onclick=()=>step(-1);$('forward').onclick=()=>step(1);$('play').onclick=()=>vids().forEach(v=>v.paused?v.play():v.pause());$('prev').onclick=()=>{index=Math.max(0,index-1);draw()};$('next').onclick=()=>{index=Math.min(cases.length-1,index+1);draw()};$('item').onchange=()=>{index=+$('item').value;draw()};$('markStart').onclick=()=>{$('start').value=Math.floor(vids()[0].currentTime*catalog.find(e=>e.episode_id===cases[index].episode_id).fps+1e-4)};$('markEnd').onclick=()=>{const f=Math.floor(vids()[0].currentTime*catalog.find(e=>e.episode_id===cases[index].episode_id).fps+1e-4);$('end').value=f+1;$('evidence').value=f};
$('save').onclick=()=>{const c=cases[index],e=catalog.find(e=>e.episode_id===c.episode_id),start=+$('start').value,end=+$('end').value,ev=+$('evidence').value,cams=[...document.querySelectorAll('.camera:checked')].map(x=>x.value);if(!$('reviewer').value.trim()||!$('verdict').value||!$('note').value.trim()||!cams.length||![start,end,ev].every(Number.isInteger)||!(0<=start&&start<end&&end<=e.length&&start<=ev&&ev<end)){ $('message').textContent='请填写审核者、结论、可见相机、有效帧区间及直接证据说明';return}const prior=store[c.case_id],history=prior?[...(prior.revisions||[]),{verdict:prior.verdict,start_frame:prior.start_frame,end_frame:prior.end_frame,evidence_end_frame:prior.evidence_end_frame,evidence_note:prior.evidence_note,reviewed_at:prior.reviewed_at}]:[];store[c.case_id]={revisions:history,case_id:c.case_id,episode_id:c.episode_id,source_recording_id:c.source_recording_id,event_type:c.event_type,annotation_sha256:c.annotation_sha256,reviewer:$('reviewer').value.trim(),verdict:$('verdict').value,start_frame:start,end_frame:end,evidence_end_frame:ev,visible_cameras:cams,evidence_note:$('note').value.trim(),reviewed_at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(store));$('message').textContent='已保存个人意见；尚未双人批准';$('counter').textContent=`${index+1}/${cases.length} · 已填 ${Object.keys(store).length}`};
$('export').onclick=()=>{const value={schema_version:'tomato-operation-review-v1',identity,reviews:Object.values(store)},blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='operation-review-'+($('reviewer').value||'reviewer')+'.json';a.click();URL.revokeObjectURL(a.href)};
(async()=>{[cases,catalog,identity]=await Promise.all(['cases.json','catalog.json','identity.json'].map(p=>fetch(p,{cache:'no-store'}).then(r=>r.json())));key='tomato-operation-review:'+identity.catalog_sha256;store=JSON.parse(localStorage.getItem(key)||'{}');const eligible=new Map(cases.map(c=>[c.case_id,c]));for(const sha of identity.previous_catalog_sha256||[]){const prior=JSON.parse(localStorage.getItem('tomato-operation-review:'+sha)||'{}');for(const [id,r] of Object.entries(prior)){if(!store[id]&&eligible.get(id)?.annotation_sha256===r.annotation_sha256)store[id]=r}}store=Object.fromEntries(Object.entries(store).filter(([id,r])=>eligible.get(id)?.annotation_sha256===r.annotation_sha256));localStorage.setItem(key,JSON.stringify(store));cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} ${c.event_type} ${c.episode_id.slice(0,8)}`;$('item').append(o)});if(identity.selection_note)$('message').textContent=identity.selection_note;draw()})()
</script></html>
