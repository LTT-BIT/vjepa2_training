<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-JEPA 2 · 番茄离线验证</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>LOCAL93 / READ-ONLY REVIEW</small><h1>番茄四阶段 · 离线验证</h1></div><span>V-JEPA 2 · 冻结模型</span></header>
<div class="layout"><aside><h2>样本目录 <span id="count"></span></h2><input id="search" placeholder="来源 ID / Episode / 数据包" aria-label="搜索样本"><select id="split" aria-label="数据划分"><option value="">全部划分</option><option>train</option><option>val</option><option>test</option></select><select id="package" aria-label="数据包"><option value="">全部数据包</option></select><div id="episodes"></div></aside>
<main><div id="identity">请选择一条样本。原始视频与审核标注只读。</div><div class="videos"><figure><figcaption>cam0</figcaption><video id="v0" muted playsinline preload="metadata"></video></figure><figure><figcaption>cam1</figcaption><video id="v1" muted playsinline preload="metadata"></video></figure><figure><figcaption>cam2</figcaption><video id="v2" muted playsinline preload="metadata"></video></figure></div>
<div class="controls"><button id="play">播放</button><button id="prev">−1 帧</button><button id="next">+1 帧</button><select id="speed" aria-label="播放倍速"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><input type="range" id="seek" min="0" max="1" value="0" step="1" aria-label="视频帧"><output id="clock">0.00s</output></div>
<section class="action"><label>识别模式 <select id="mode"><option value="future_only">Future-only · 未来</option><option value="joint">Joint · 当前＋未来</option><option value="current_only">Current-only · 当前</option></select></label><button class="primary" id="recognize">识别此样本</button><button id="recompute">仅重算此样本分类头</button><button id="export" disabled>导出当前样本带标签视频</button></section>
<p id="status" role="status">未识别 · 不会自动批量推理或导出</p><p class="note">主轴为观测时刻；Future 是原始锚点 +1.0s 的预测，不能当作 GT(now)。非锚点帧显示 HELD，不产生新预测。概率不是校准准确率。</p>
<div id="tracks" class="tracks"></div><section id="details" class="details">选择样本后显示人工粗阶段；识别后显示各头四类概率。</section><p id="warning" class="note"></p><a id="download" hidden>预览 / 下载带标签 MP4</a></main></div><script src="/app.js"></script></body></html>
